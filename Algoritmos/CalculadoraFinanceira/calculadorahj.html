<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoConnect | Calculadora de Investimento</title>
</head>

<body>

    <h1>InfoConnect</h1>
    <h2>Simulação de Investimento</h2>

    <h3>01 · Implementação</h3>
    <span>Quantidade de corredores:</span>
    <input type="number" id="input_corredores" placeholder="Ex: 5">
    <br><br>
    <span>Comprimento de cada corredor (metros):</span>
    <input type="number" id="input_metros" placeholder="Ex: 10">
    <br><br>
    <button onclick="calcular_implementacao()">Calcular Implementação</button>
    <br><br>
    <div id="div_implementacao"></div>

    <br>
    <hr>
    <br>

    <h3>02 · Retorno do Investimento (ROI)</h3>
    <span>Período da simulação (meses):</span>
    <input type="number" id="input_meses_roi" value="12">
    <br><br>
    <button onclick="calcular_roi()">Calcular ROI</button>
    <br><br>
    <div id="div_roi"></div>

    <br>
    <hr>
    <br>

    <h3>03 · Exemplo por Produto</h3>
    <span>Preço de venda (R$):</span>
    <input type="number" id="input_preco" placeholder="Ex: 50.00">
    <br><br>
    <span>Custo de compra (R$):</span>
    <input type="number" id="input_custo" placeholder="Ex: 20.00">
    <br><br>
    <span>Quantidade vendida no mês:</span>
    <input type="number" id="input_quantidade" placeholder="Ex: 100">
    <br><br>
    <button onclick="calcular_lucro()">Calcular Lucro e Comparar</button>
    <br><br>
    <div id="div_lucro"></div>

</body>

</html>

<script>
    let investimento = 0;

    function calcular_implementacao() {
        let corredores = Number(input_corredores.value);
        let metros = Number(input_metros.value);
        let preco_sensor = 150;
        let instalacao_sensor = 50;

        if (corredores > 0 && metros > 0) {
            let sensores_por_corredor = Math.ceil(metros / 4);
            let total_sensores = corredores * sensores_por_corredor;
            let equipamentos = total_sensores * preco_sensor;
            let instalacao = total_sensores * instalacao_sensor;

            investimento = equipamentos + instalacao;

            div_implementacao.innerHTML = `
                <b>Investimento inicial estimado:</b> R$ ${investimento.toFixed(2)}<br>
                ${corredores} corredor(es) de ${metros}m — Total de ${total_sensores} sensores.<br><br>
                Sensores por corredor: ${sensores_por_corredor}<br>
                Equipamentos: R$ ${equipamentos.toFixed(2)}<br>
                Instalação: R$ ${instalacao.toFixed(2)}
            `;
        } else {
            div_implementacao.innerHTML = "Informe a quantidade e o comprimento dos corredores corretamente.";
        }
    }

    function calcular_roi() {
        calcular_implementacao();
        let meses = Number(input_meses_roi.value);
        let taxa_mensal = 10;

        if (investimento > 0) {
            if (meses > 0) {
                let ganho_mensal = investimento * (taxa_mensal / 100);
                let ganho_total = ganho_mensal * meses;
                let saldo = ganho_total - investimento;
                let roi = (saldo / investimento) * 100;

                div_roi.innerHTML = `
                    <b>ROI em ${meses} meses:</b> ${roi.toFixed(2)}%<br>
                    <b>Investimento inicial:</b> R$ ${investimento.toFixed(2)}<br>
                    <b>Ganho acumulado:</b> R$ ${ganho_total.toFixed(2)}<br>
                    <b>Saldo final:</b> R$ ${saldo.toFixed(2)}<br><br>
                    Ganho mensal estimado: R$ ${ganho_mensal.toFixed(2)}
                `;
            } else {
                div_roi.innerHTML = "Informe um período válido de meses.";
            }
        } else {
            div_roi.innerHTML = "Preencha primeiro os dados do módulo de implementação.";
        }
    }

    function calcular_lucro() {
        calcular_implementacao();
        let preco = Number(input_preco.value);
        let custo = Number(input_custo.value);
        let quantidade = Number(input_quantidade.value);

        if (preco > 0 && custo >= 0 && quantidade >= 0) {
            let lucro_unidade = preco - custo;
            let lucro_atual = lucro_unidade * quantidade;

            if (lucro_unidade > 0) {
                let ganho_extra = lucro_unidade * 30;
                let lucro_cenario = lucro_atual + ganho_extra;
                let ganho_anual = ganho_extra * 12;

                let texto = `
                    Lucro bruto por unidade: R$ ${lucro_unidade.toFixed(2)}<br>
                    Lucro bruto no mês: R$ ${lucro_atual.toFixed(2)}<br><br>
                    <b>Cenário com +1 venda por dia (+30/mês):</b><br>
                    + R$ ${ganho_extra.toFixed(2)} por mês<br>
                    + R$ ${ganho_anual.toFixed(2)} acumulado em 12 meses<br>
                    Novo lucro mensal: R$ ${lucro_cenario.toFixed(2)}<br>
                `;

                if (investimento > 0) {
                    let unidades_necessarias = Math.ceil(investimento / lucro_unidade);
                    texto += `<br><b>Perspectiva do investimento:</b> Você precisa vender <b>${unidades_necessarias} unidades extras</b> deste produto para pagar o investimento de R$ ${investimento.toFixed(2)}.`;
                } else {
                    texto += `<br>Preencha a implementação para calcular o número de vendas necessárias para cobrir o custo.`;
                }

                div_lucro.innerHTML = texto;
            } else {
                div_lucro.innerHTML = "O preço de venda precisa ser maior que o custo de compra.";
            }
        } else {
            div_lucro.innerHTML = "Informe preço, custo e quantidade válidos.";
        }
    }
</script>
