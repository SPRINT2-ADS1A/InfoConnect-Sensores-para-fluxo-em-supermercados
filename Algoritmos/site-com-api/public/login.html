<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InfoConnect - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/style-login.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <a href="./index.html">
      <img src="img/logoCompleta.png" class="img" /> 
    </a>
    </header>

    <main>
      <div class="caixa-login">
        <div class="esquerda">
          <h1>
            Conheça o <br />
            <span>InfoConnect</span>
          </h1>

          <p>Explore, conecte, transforme!</p>
        </div>

        <div class="direita">
          <div class="campo">
            <span>E-mail:</span>
            <input type="text" id="input_email" placeholder="Login" />
          </div>

          <div class="campo">
            <span>Senha:</span>
            <input type="password" id="input_senha" placeholder="**********" />
          </div>

          <button class="btn-entrar" onclick="login()">Entrar</button>

          <div class="loginvalido login_sucesso" id="div_mensagem"></div>

          <div class="loginvalido login_erro" id="div_mensagem2"></div>

          <button
            class="btn-cadastrar-login"
            onclick="window.location.href = 'cadastro.html'"
          >
            Criar Conta
          </button>
        </div>
      </div>
    </main>

</body>
</html>
<script>
    function login() {
        var emailVar = input_email.value.trim();
        var senhaVar = input_senha.value;
        div_mensagem.innerHTML = "";
        div_mensagem2.innerHTML = "";

        if (emailVar == "" || senhaVar == "") {
            div_mensagem2.innerHTML = "Preencha o e-mail e a senha!";
        } else {
            fetch("/usuarios/autenticar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    emailServer: emailVar,
                    senhaServer: senhaVar
                })
            }).then(function (resposta) {
                if (resposta.ok) {
                    return resposta.json();
                } else {
                    throw new Error("E-mail ou senha invalidos!");
                }
            }).then(function (usuario) {
                // Mesmo armazenamento local simples usado nas aulas de Web Data Viz.
                sessionStorage.ID_CLIENTE = usuario.id;
                sessionStorage.NOME_USUARIO = usuario.nome;
                div_mensagem.innerHTML = "Login valido!";
                window.location.href = "dashboard.html";
            }).catch(function (erro) {
                div_mensagem2.innerHTML = erro.message;
            });
        }
    }
</script>
