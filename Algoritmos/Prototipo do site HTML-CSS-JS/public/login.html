<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InfoConnect - Login</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="pagina_login_bianca">

    <!-- Topo -->
    <div class="topo">

        <!-- Logo -->
        <a href="index.html" class="logo">
            <span>Info</span><b>Connect</b>
        </a>

        <!-- Menu -->
        <div class="menu">

            <a href="index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="servicos.html">Serviços</a>
            <a href="simulador.html">Simulador</a>
            <a href="suporte.html">Suporte</a>

        </div>

        <!-- Login -->
        <div class="acoes">

            <!-- Icone de usuario -->
            <button class="icone_usuario" onclick="irParaLogin()">

                <div class="cabeca_usuario"></div>

                <div class="corpo_usuario"></div>

            </button>

            <!-- Botao -->
            <button class="botao_login" onclick="irParaLogin()">
                Entrar
            </button>

        </div>

    </div>


    <!-- Area do login -->
    <div class="area_login_bianca">

        <!-- Caixa principal -->
        <div class="caixa-login">

            <!-- Lado esquerdo -->
            <div class="esquerda-login">

                <h1>
                    Conheça o <br>
                    InfoConnect
                </h1>

                <p>Explore, conecte, transforme!</p>

            </div>


            <!-- Lado direito -->
            <div class="direita-login">

                <!-- Email -->
                <div class="campo-login-bianca">

                    <span>E-mail:</span>

                    <input type="text" id="input_email" placeholder="Digite seu e-mail">

                </div>


                <!-- Senha -->
                <div class="campo-login-bianca">

                    <span>Senha:</span>

                    <input type="password" id="input_senha" placeholder="**********">

                </div>


                <!-- Mostrar senha -->
                <div class="mostrar-senha-bianca">

                    <input type="checkbox" id="check_senha" onclick="mostrarSenha()">

                    <span>Mostrar senha</span>

                </div>


                <!-- Botao entrar -->
                <button class="btn-entrar" onclick="login()">

                    Entrar

                    <span>→</span>

                </button>


                <!-- Resultado -->
                <div id="div_login_bianca">

                </div>


                <!-- Esqueci minha senha -->
                <button class="btn-senha" onclick="senha()">
                    Esqueci minha senha
                </button>


                <!-- Recuperar senha -->
                <div class="recuperacao_bianca" id="div_recuperacao_bianca">

                    <h3>Recuperar senha</h3>

                    <p>Informe o e-mail da sua conta.</p>

                    <input type="text" id="input_email_recuperar" placeholder="Digite seu e-mail">

                    <button onclick="recuperarSenha()">
                        Enviar recuperação
                    </button>

                    <div id="div_resultado_recuperacao">

                    </div>

                </div>


                <!-- Cadastro -->
                <div class="cadastro_login">

                    <span>
                        Ainda não possui uma conta?
                        <a href="cadastro.html">Cadastre-se</a>
                    </span>

                </div>

            </div>

        </div>

    </div>


    <script src="../Js/script.js"></script>

</body>

</html>
