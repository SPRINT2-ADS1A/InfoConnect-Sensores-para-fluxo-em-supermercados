<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InfoConnect - Cadastro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/stylecadastro.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <a href="./index.html">
      <img src="img/logoCompleta.png" class="img" /> 
    </a>

      <nav class="nav-bar">
        <ul>
          <li><a href="C:\Users\Dell\Downloads\InfoConnect-Sensores-para-fluxo-em-supermercados\Algoritmos\public\site\homepage-principal\index.html"><---  </a></li>
        </ul>
      </nav>
      <div class="icones">
        <i class="fa-solid fa-magnifying-glass"></i>
        <i
          onclick="window.location.href = 'login.html'"
          class="fa-regular fa-user"
        ></i>
      </div>
    </header>

    <main>
      <div class="card">
        <div class="cabecalho_card">
          <h2 class="titulo_card">Cadastrar Estabelecimento</h2>
          <p class="subtitulo_card">
            Cadastre a empresa e o usuário administrador
          </p>
        </div>

        <form id="form_cadastro" onsubmit="return cadastrar()">
          <!-- Dados da Empresa -->
          <div class="secao_formulario">
            <h3 class="titulo_secao">Dados da Empresa (Supermercado)</h3>

            <div class="linha_dupla">
              <div class="grupo_input">
                <label for="input_nomeFantasia">Nome Fantasia</label>
                <input
                  type="text"
                  id="input_nomeFantasia"
                  placeholder="Ex: Mercado São José"
                />
              </div>
              <div class="grupo_input">
                <label for="input_cnpj">CNPJ</label>
                <input
                  type="text"
                  id="input_cnpj"
                  placeholder="00.000.000/0001-00"
                />
              </div>
            </div>

            <div class="linha_dupla">
              <div class="grupo_input">
                <label for="input_responsavel"
                  >Responsável Técnico/Gestor</label
                >
                <input
                  type="text"
                  id="input_responsavel"
                  placeholder="Nome completo"
                />
              </div>
              <div class="grupo_input">
                <label for="input_telefone">Telefone (com DDD)</label>
                <input
                  type="text"
                  id="input_telefone"
                  placeholder="11987654321"
                />
              </div>
            </div>


            <div class="grupo_input">
              <label for="input_cpf">CPF do Responsavel</label>
              <input type="text" id="input_cpf" placeholder="000.000.000-00" maxlength="14" />
            </div>

            <div class="grupo_input">
              <label for="input_emailEmpresa">E-mail Institucional</label>
              <input
                type="text"
                id="input_emailEmpresa"
                placeholder="contato@empresa.com"
              />
            </div>

            <div class="linha_tripla">
              <div class="grupo_input linha_uf">
                <label for="input_uf">UF</label>
                <input
                  type="text"
                  id="input_uf"
                  placeholder="SP"
                  maxlength="2"
                />
              </div>
              <div class="grupo_input linha_cidade">
                <label for="input_cidade">Cidade</label>
                <input type="text" id="input_cidade" placeholder="São Paulo" />
              </div>
              <div class="grupo_input linha_logradouro">
                <label for="input_logradouro">Logradouro</label>
                <input
                  type="text"
                  id="input_logradouro"
                  placeholder="Rua / Av"
                />
              </div>
            </div>
          </div>
          <!-- Dados do Usuário -->
          <div class="secao_formulario">
            <h3 class="titulo_secao">Dados do Usuário Administrador</h3>

            <div class="linha_dupla">
              <div class="grupo_input">
                <label for="input_nomeUsuario">Nome de Usuário</label>
                <input
                  type="text"
                  id="input_nomeUsuario"
                  placeholder="Ex: gestor.saojose"
                />
              </div>
              <div class="grupo_input">
                <label for="input_cargo">Cargo</label>
                <input type="text" id="input_cargo" placeholder="Ex: Gerente" />
              </div>
            </div>

            <div class="linha_dupla">
              <div class="grupo_input">
                <label for="input_senha">Senha</label>
                <input
                  type="password"
                  id="input_senha"
                  placeholder="••••••••"
                />
              </div>
              <div class="grupo_input">
                <label for="input_confirmarSenha">Confirmar Senha</label>
                <input
                  type="password"
                  id="input_confirmarSenha"
                  placeholder="••••••••"
                />
              </div>
            </div>
          </div>

          <br />

          <button
            type="button"
            onclick="cadastrar()"
            class="botao_cadastrar"
          >
            Finalizar Cadastro
          </button>
          <button
            type="button"
            onclick="window.location.href = 'login.html'"
            class="btn-voltar-login"
          >
            Já tem conta? Voltar ao Login
          </button>
        </form>

        <!-- div erro/sucesso -->
        <div id="div_mensagem" class="msg_erro"></div>
      </div>
    </main>
  <script>
// Cadastro do InfoConnect - seguindo o estilo do Web Data Viz / AquaTech.
function cadastrar() {
    // 1. Pega os valores dos inputs HTML.
    var nomeFantasiaVar = input_nomeFantasia.value;
    var cnpjVar = input_cnpj.value;
    var responsavelVar = input_responsavel.value;
    var cpfVar = input_cpf.value;
    var telefoneVar = input_telefone.value;
    var emailVar = input_emailEmpresa.value;
    var ufVar = input_uf.value;
    var cidadeVar = input_cidade.value;
    var logradouroVar = input_logradouro.value;

    var nomeVar = input_nomeUsuario.value;
    var cargoVar = input_cargo.value;
    var senhaVar = input_senha.value;
    var confirmacaoSenhaVar = input_confirmarSenha.value;

    // 2. Esconde qualquer mensagem de uma tentativa anterior.
    var mensagem = "";
    div_mensagem.innerHTML = "";
    div_mensagem.style.display = "none";

    // 3. Verifica se faltou preencher alguma informação obrigatória.
    if (
        nomeFantasiaVar.trim() == "" ||
        cnpjVar.trim() == "" ||
        responsavelVar.trim() == "" ||
        cpfVar.trim() == "" ||
        telefoneVar.trim() == "" ||
        emailVar.trim() == "" ||
        ufVar.trim() == "" ||
        cidadeVar.trim() == "" ||
        logradouroVar.trim() == "" ||
        nomeVar.trim() == "" ||
        cargoVar.trim() == "" ||
        senhaVar == "" ||
        confirmacaoSenhaVar == ""
    ) {
        mensagem = "Preencha todos os campos!";
        div_mensagem.innerHTML = mensagem;
        div_mensagem.className = "msg_erro";
        div_mensagem.style.display = "block";
        return false; // Para por aqui: não chega ao fetch.
    }

    // 4. Verifica se as duas senhas são iguais.
    if (senhaVar != confirmacaoSenhaVar) {
        mensagem = "As senhas não coincidem!";
        div_mensagem.innerHTML = mensagem;
        div_mensagem.className = "msg_erro";
        div_mensagem.style.display = "block";
        return false;
    }

    if (senhaVar.length < 8 || senhaVar.length > 72) {
        mensagem = "A senha precisa ter entre 8 e 72 caracteres!";
        div_mensagem.innerHTML = mensagem;
        div_mensagem.className = "msg_erro";
        div_mensagem.style.display = "block";
        return false;
    }

    // 5. Remove os pontos, traços e barras do /CNPJ.
    var cnpjNumeros = cnpjVar.replace(/\D/g, "");
    var cpfNumeros = cpfVar.replace(/\D/g, "");

    if (cnpjNumeros.length != 14) {
        mensagem = "O CNPJ precisa ter 14 números!";
        div_mensagem.innerHTML = mensagem;
        div_mensagem.className = "msg_erro";
        div_mensagem.style.display = "block";
        return false;
    }

    if (cpfNumeros.length != 11) {
        div_mensagem.innerHTML = "O CPF precisa ter 11 numeros!";
        div_mensagem.className = "msg_erro";
        div_mensagem.style.display = "block";
        return false;
    }

    // 6. Envia um JSON para o servidor Express.
    // Os nomes que terminam em Server são os que o controller lê em req.body.
    fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            nomeServer: nomeVar,
            emailServer: emailVar,
            senhaServer: senhaVar,
            cargoServer: cargoVar,
            nomeFantasiaServer: nomeFantasiaVar,
            cnpjServer: cnpjNumeros,
            responsavelServer: responsavelVar,
            cpfServer: cpfNumeros,
            telefoneServer: telefoneVar,
            ufServer: ufVar,
            cidadeServer: cidadeVar,
            logradouroServer: logradouroVar
        })
    })
    .then(function (resposta) {
        // 7. Verifica se o backend confirmou o cadastro.
        if (resposta.ok) {
            mensagem = "Cadastro realizado com sucesso! Indo para o login...";
            div_mensagem.innerHTML = mensagem;
            div_mensagem.className = "msg_sucesso";
            div_mensagem.style.display = "block";

            setTimeout(function () {
                window.location = "login.html";
            }, 2000);
        } else {
            // Lê a mensagem de erro enviada pelo backend
            return resposta.text().then(function (textoErro) {
                throw new Error(textoErro || "Erro HTTP: " + resposta.status);
            });
        }
    })
    .catch(function (erro) {
        console.log("#ERRO:", erro);
        div_mensagem.innerHTML = erro.message || "Não foi possível realizar o cadastro.";
        div_mensagem.className = "msg_erro";
        div_mensagem.style.display = "block";
    });

    // Impede o envio tradicional do formulário HTML.
    return false;
}
  </script>
  </body>
</html>
