<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoConnect - Login</title>

 <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;700&display=swap"
      rel="stylesheet"
    />



    <link rel="stylesheet" href="./css/stylecadastro.css" />

    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <header>
      <span class="logo">InfoConnect</span>

      <nav class="nav-bar">
        <ul>
          <li><a href="#">Sobre</a></li>
          <li><a href="#">Serviços</a></li>
          <li><a href="#">Suporte</a></li>
        </ul>
      </nav>
      <div class="icones">
        <i class="fa-solid fa-magnifying-glass"></i>
        <i
          onclick="window.location.href = 'login.html'"
          class="fa-regular fa-user"
        ></i>
      </div>
    </header>


    <main>
        <div class="caixa-login">
            <div class="esquerda">
                <h1>
                    Conheça o <br>
                    <span>InfoConnect</span>
                </h1>

                <p>Explore, conecte, transforme!</p>
            </div>

            <div class="direita">
                <div class="campo">
                    <span>E-mail:</span>
                    <input type="text" id="input_email" placeholder="Login">
                </div>   

                <div class="campo">
                    <span>Senha:</span>
                    <input type="password" id="input_senha" placeholder="**********">
                </div>   

                <button class="btn-entrar" onclick="login()">Entrar</button>
                
                <div class="loginvalido login_sucesso" id="div_mensagem"></div>

                <div class="loginvalido login_erro" id="div_mensagem2"></div>
    
                <button class="btn-cadastrar-login" onclick="window.location.href='cadastro.html'">Criar Conta</button>
            </div>
        </div>
    </main>

  <script>
    function login() {
        var emailVar = input_email.value;
        var senhaVar = input_senha.value;
        div_mensagem.innerHTML = "";
        div_mensagem2.innerHTML = "";

        if (emailVar == "" || senhaVar == "") {
            div_mensagem2.innerHTML = "Preencha email e senha!";
            return false;
        }

        // Mesmo POST /usuarios/autenticar usado na AquaTech.
        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ emailServer: emailVar, senhaServer: senhaVar })
        })
        .then(function (resposta) {
            if (!resposta.ok) throw new Error("Email ou senha invalidos!");
            return resposta.json();
        })
        .then(function (usuario) {
            // SessionStorage eh usado no Web Data Viz para mostrar dados na pagina.
            // Nao e um token nem garante autenticacao protegida no servidor.
            sessionStorage.setItem("ID_USUARIO", usuario.id);
            sessionStorage.setItem("NOME_USUARIO", usuario.nome);
            sessionStorage.setItem("ID_SUPERMERCADO", usuario.supermercadoId);
            sessionStorage.setItem("NOME_SUPERMERCADO", usuario.nomeFantasia);
            div_mensagem.innerHTML = "Login valido!";
            window.location.href = "/DASH/dashboard.html";
        })
        .catch(function (erro) {
            console.log(erro);
            div_mensagem2.innerHTML = erro.message;
        });
        return false;
    }
  </script>
</body>
</html>
