<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InfoConnect - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <a href="../homepage-principal/index.html">
      <img src="img/logoCompleta.png" class="img" /> 
    </a>

      <nav class="nav-bar">
        <ul>
               <li><a href="C:\Users\Fabs\Documents\P.I\InfoConnect-Sensores-para-fluxo-em-supermercados\Algoritmos\public\site\homepage-principal\index.html"><---  </a></li>
        </ul>
      </nav>
      <div class="icones">
        <i class="fa-solid fa-magnifying-glass"></i>
        <i
          onclick="window.location.href = 'login.html'"
          class="fa-regular fa-user"
        ></i>
      </div>
    </header>

    <main>
      <div class="caixa-login">
        <div class="esquerda">
          <h1>
            Conheça o <br />
            <span>InfoConnect</span>
          </h1>

          <p>Explore, conecte, transforme!</p>
        </div>

        <div class="direita">
          <div class="campo">
            <span>E-mail:</span>
            <input type="text" id="input_email" placeholder="Login" />
          </div>

          <div class="campo">
            <span>Senha:</span>
            <input type="password" id="input_senha" placeholder="**********" />
          </div>

          <button class="btn-entrar" onclick="login()">Entrar</button>

          <div class="loginvalido login_sucesso" id="div_mensagem"></div>

          <div class="loginvalido login_erro" id="div_mensagem2"></div>

          <button
            class="btn-cadastrar-login"
            onclick="window.location.href = 'cadastro.html'"
          >
            Criar Conta
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
<script>
  let email = "supermercado@email.com";
  let senha = "Market123";

  function login() {
    let entradaSenha = input_senha.value;
    let entradaEmail = input_email.value;

    if (senha == entradaSenha && email == entradaEmail) {
      div_mensagem.innerHTML = `Login válido!`;
      div_mensagem2.innerHTML = ``;
    } else {
      div_mensagem2.innerHTML = `E-mail ou senha inválidos!`;
      div_mensagem.innerHTML = ``;
    }
  }
</script>
