<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoConnect - Login</title>

  <link rel="stylesheet" href="./css/style.css" />

</head>
<body>
    <header>
        <span class="logo">InfoConnect</span>

        <nav>
            <span>Sobre</span>
            <span>Serviços</span>
            <span>Suporte</span>
        </nav>

        <div class="icones">
            <span>🔍</span>
            <span>👤</span>
        </div>
    </header>

<main>
    <div class="caixa-login">

        <div class="esquerda">
            <h1>Conheça o <br> InfoConnect</h1>
            <p>Explore, conecte, transoforme!</p>
        </div>

        <div class="direita">

            <div class="campo">
                <span>E-mail:</span>
                <input type="text" id="input_email" placeholder="Login"> <br>
            </div>   

            <div class="campo">
                <span>Senha:</span>
                <input type="password" id="input_senha" placeholder="**********"> <br>
            </div>   

                <button class="btn-entrar" onclick="login()">Entrar</buttclass="btn-entrar" on> <br>

                <button class="btn-senha" onclick="senha()">Esqueci minha senha</button>
        
        </div>
    </div>
</main>    
</body>
</html>
